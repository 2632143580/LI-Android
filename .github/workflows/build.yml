name: Build LI Android APK

# 触发条件：① 推送到 main 自动构建；② 也可在 GitHub Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（不依赖第三方 action，最稳）
      - name: 安装 Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 安装 Gradle 8.9（工程指定版本，AGP 8.5.2 要求）
      - name: 安装 Gradle 8.9
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -o gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip
            echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi

      - name: 编译 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 作为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
