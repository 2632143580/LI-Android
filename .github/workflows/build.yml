name: Build LI Android APK

# 触发条件：① 推送到 main 自动构建；② 也可在 GitHub Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要写权限，才能把编译错误以「提交评论」形式回传（供远程诊断；默认 token 只有读权限）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（不依赖第三方 action，最稳）
      # 关键：runner 预装了 Android SDK（/usr/local/lib/android/sdk），
      # 若不清掉系统变量，Gradle 会检测到两个不同 SDK 路径直接报错：
      # "Several environment variables contain different paths to the SDK"
      - name: 安装 Android SDK
        run: |
          # 清除 runner 自带的 SDK 环境变量，避免冲突
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # 写入 GITHUB_ENV 时也显式覆盖，确保后续步骤只用我们的 SDK。
          # 关键：runner 自带 ANDROID_SDK_ROOT 指向它预装的 SDK，只在当前 shell unset 不跨步生效，
          # 必须把两个变量都用 GITHUB_ENV 指到同一自定义 SDK，否则 Gradle 报"different paths to the SDK"。
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 安装 Gradle 8.9（工程指定版本，AGP 8.5.2 要求）
      - name: 安装 Gradle 8.9
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -o gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip
            echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          fi

      # 编译 debug APK；输出全部写入 build.log（供失败时报错）
      # 注意：不要用 continue-on-error，否则失败会被伪装成绿色、且错误评论机制不会触发
      - name: 编译 debug APK
        id: build
        run: gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1

      # 编译失败：把关键错误行以「提交评论」形式回传，远程可直接读取定位
      - name: 上报编译错误
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERR=$(grep -iE "e: .*\.kt:|What went wrong|FAILURE|error:|> Task :app:.*FAILED|Exception|Unresolved reference" build.log | head -60)
          if [ -z "$ERR" ]; then ERR="(无匹配关键行，附末尾50行)\n$(tail -50 build.log)"; fi
          BODY=$(printf '%s' "$ERR" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          curl -sk -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $BODY}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"

      # 编译成功：上传 APK 作为可下载产物
      - name: 上传 APK 作为可下载产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
